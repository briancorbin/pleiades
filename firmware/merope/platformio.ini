; Merope — the black box. Core logic (ring buffer, fault watcher) is portable
; C, unit-tested on the host:
;
;     pio test -e native
;
; The esp32s3 env is the real target; it stays untouched until parts arrive
; (building it downloads the Espressif toolchain, so it's not the default).

[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=c11 -Wall -Wextra -Werror
test_framework = unity

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
build_flags = -std=c11 -Wall -Wextra
