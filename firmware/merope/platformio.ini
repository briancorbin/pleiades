; Merope — the black box.
;
;   pio test -e native                       core logic, on the Mac
;   pio run -e merope -t upload -t monitor   flash the black box
;   pio run -e electra -t upload -t monitor  flash the fake car
;
; Desk bench wiring (both boards identical): 3V3→3.3V, GND→GND,
; GPIO4→CTX, GPIO5→CRX; then CANH↔CANH, CANL↔CANL, GND↔GND between the
; two transceivers. Termination is already on the Waveshare boards.

[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=c11 -Wall -Wextra -Werror
build_src_filter = -<*> +<main.c>
test_framework = unity

[esp32s3_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; -Wno-error=cpp: ESP-IDF 6 deprecates the legacy TWAI driver with a #warning
; and builds with -Werror. The new esp_twai.h API is a later migration
; (tracked in SHED-70); the legacy driver works fine today.
build_flags = -Wall -Wextra -Wno-error=cpp -DMRP_TWAI_TX=4 -DMRP_TWAI_RX=5 -DMRP_LED_GPIO=48

[env:merope]
extends = esp32s3_base
build_flags = ${esp32s3_base.build_flags} -DMRP_APP_MEROPE

[env:electra]
extends = esp32s3_base
build_flags = ${esp32s3_base.build_flags} -DMRP_APP_ELECTRA
